<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goddess</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

/* 背景图片层 */
#bg{
    position:fixed;
    inset:0;
    background:url("./first.image/Frame 3.png") center center / cover no-repeat;
    z-index:0;
}

/* Three.js canvas 叠在背景上 */
canvas{
    position:fixed;
    inset:0;
    display:block;
    opacity:0;
    animation:fadeIn 1.5s forwards;
    z-index:1;
}

@keyframes fadeIn{
    from{ opacity:0; }
    to{   opacity:1; }
}

/* 跳转白光遮罩 */
#flash{
    position:fixed;
    inset:0;
    background:#ffffff;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:999;
}

#flash.active{
    opacity:1;
}

</style>

</head>

<body>

<div id="bg"></div>
<div id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

/* ── 场景 ── */
const scene = new THREE.Scene();
scene.background = null;   /* 透明，露出背景图 */

/* ── 相机 ── */
const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 0.3, 6);

/* ── 渲染器（alpha透明）── */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);   /* 完全透明 */
document.body.appendChild(renderer.domElement);

/* ── 灯光 ── */
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
directionalLight.position.set(5, 10, 10);
scene.add(directionalLight);

const blueLight = new THREE.PointLight(0x66ccff, 0.8, 20);
blueLight.position.set(0, 1.5, 2);
scene.add(blueLight);

/* ── 深蓝能量线 ── */
const energyLine = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.4, 60, 32),
    new THREE.MeshBasicMaterial({ color:0x0a1a6e, transparent:true, opacity:0.85 })
);
energyLine.rotation.z = -Math.PI / 3;
energyLine.position.set(-12, -8, -2);
energyLine.scale.y = 0;
scene.add(energyLine);

/* ── 四角星 ── */
const starTexture  = new THREE.TextureLoader().load("./first.image/星.png");
const starMaterial = new THREE.SpriteMaterial({
    map: starTexture,
    transparent: true,
    depthWrite: false
});
const glowSphere = new THREE.Sprite(starMaterial);
glowSphere.visible = false;
glowSphere.scale.set(0.1, 0.1, 0.1);  /* 初始极小 */
scene.add(glowSphere);

/* ── 模型 ── */
let statue;
let statueLocked = false;
const statueGroup = new THREE.Group();
scene.add(statueGroup);

new THREE.GLTFLoader().load(
    "./models/Untitled(8).glb",
    function(gltf){
        statue = gltf.scene;
        statue.scale.set(3.5, 3.5, 3.5);
        statue.position.set(-0.1, -0.9, -0.4);
        statue.rotation.y = Math.PI;   /* 背对观众 */
        statueGroup.add(statue);
    },
    undefined,
    function(err){ console.error(err); }
);

/* ── 滚动进度 ── */
let progress     = 0;
let lastProgress = 0;
let jumping      = false;

window.addEventListener("wheel", (e) => {
    if(jumping) return;
    progress += e.deltaY * 0.00018;
    progress  = Math.max(0, Math.min(1.5, progress));
});

/* ── 跳转动画 ── */
function triggerJump(){
    if(jumping) return;
    jumping = true;

    const flash = document.getElementById("flash");
    flash.style.transition = "opacity 0.25s ease";
    flash.classList.add("active");

    setTimeout(() => {
        setTimeout(() => {
            window.location.href = "scene1.html";
        }, 200);
    }, 250);
}

/* ── 动画循环 ── */
function animate(){
    requestAnimationFrame(animate);

    /* 女神转身 — 转到正面后锁定 */
    if(statue && !statueLocked){
        const target = Math.max(0, Math.PI - progress * Math.PI);
        statue.rotation.y += (target - statue.rotation.y) * 0.06;
        if(Math.abs(statue.rotation.y) < 0.005){
            statue.rotation.y = 0;
            statueLocked = true;
        }
    }

    /* 蓝线生长 */
    energyLine.scale.y +=
        (Math.min(1, progress * 1.2) - energyLine.scale.y) * 0.013;

    /* 星星
       出现区间：progress 1.1 ~ 1.5（持续时间更长）
       初始极小，结束时撑满屏幕
    */
    if(progress > 1.1){

        glowSphere.visible = true;
        glowSphere.position.set(0.22, 0.16, 1);

        /* starProgress: 0 → 0.4，范围拉长让过程更慢 */
        const starProgress = progress - 1.1;          /* 0 ~ 0.4 */
        const t            = starProgress / 0.4;       /* 0 ~ 1 归一化 */

        /* 初始 0.05，结束 80（撑满屏幕） */
        const glowScale = 0.02 + t * t * 10;
        glowSphere.scale.set(glowScale, glowScale, 1);

        /* 旋转由滚动量驱动 */
        const delta = progress - lastProgress;
        starMaterial.rotation += delta * 8;

    } else {
        glowSphere.visible = false;
    }

    lastProgress = progress;

    /* 跳转触发 */
    if(progress > 1.45 && !jumping){
        triggerJump();
    }

    renderer.render(scene, camera);
}

animate();

/* ── 自适应 ── */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
