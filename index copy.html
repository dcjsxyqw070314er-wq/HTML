<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tumbler</title>

<!-- GSAP -->

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    min-height:260vh;

    overflow-x:hidden;

    background:#E5DDD4;

    font-family:
    "PingFang SC",
    sans-serif;
}

/* =========================
   整体
========================= */

.stage-wrapper{

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

/* =========================
   主舞台
========================= */

.stage{

    position:relative;

    width:1920px;
    height:1080px;

    overflow:hidden;

    transform-origin:center center;

    left:-40px;
}

/* =========================
   背景
========================= */

.bg{

    position:absolute;

    width:97%;
    height:97%;

    left:3%;
    top:3%;

    object-fit:contain;

    z-index:1;
}

/* =========================
   人物
========================= */

.person{

    position:absolute;

    left:650px;
    top:429px;

    width:470px;

    z-index:28;

    cursor:pointer;

    transform-origin:center bottom;
}

/* =========================
   导航整体
========================= */

.nav-wrap{

    position:fixed;

    left:790px;
    top:310px;

    width:760px;
    height:44px;

    z-index:60;

    transform-origin:center center;
}

/* =========================
   导航底条
========================= */

.nav-bg{

    position:absolute;

    width:760px;
    height:50px;

    left:0;
    top:0;

    z-index:20;

    transition:0.4s;
}

/* =========================
   导航文字
========================= */

.nav{

    position:absolute;

    top:2px;

    font-size:28px;
    font-weight:400;

    color:#E5DDD4;

    text-decoration:none;

    z-index:25;

    transition:0.3s;
}

.nav:hover{

    transform:translateY(-2px);

    opacity:0.8;
}

/* 首页 */

.nav-home{

    left:115px;
}

/* 关于 */

.nav-about{

    left:335px;
}

/* 简介 */

.nav-intro{

    left:555px;
}

/* =========================
   蓝字整体
========================= */

.bottom-wrap{

    position:absolute;

    left:162px;
    top:707px;

    width:1400px;
    height:340px;

    z-index:40;
}

/* =========================
   蓝字
========================= */

.bottom-title{

    position:absolute;

    left:0;
    top:0;

    width:1400px;

    z-index:41;
}

/* =========================
   横线
========================= */

.bottom-line{

    position:absolute;

    left:0px;

    top:251px;

    width:1780px;
    height:1px;

    background:#1E1E8F;

    opacity:0.5;

    z-index:39;
}

/* =========================
   底部遮挡
========================= */

.bottom-mask{

    position:fixed;

    left:0;
    bottom:-200px;

    width:100%;
    height:200px;

    background:#E5DDD4;

    z-index:80;

    pointer-events:none;
}

/* =========================
   第二部分
========================= */

.fake-section{

    width:100%;
    height:180vh;

    background:#E5DDD4;
}

/* =========================
   自适应
========================= */

@media (max-width:1920px){

    .stage{

        transform:
        scale(calc(100vw / 1920));
    }
}

@media (max-height:1080px){

    .stage{

        transform:
        scale(
            min(
                calc(100vw / 1920),
                calc(100vh / 1080)
            )
        );
    }
}

</style>

</head>

<body>

<!-- 底部遮挡 -->

<div
    class="bottom-mask"
    id="bottomMask"
></div>

<div class="stage-wrapper">

    <div class="stage">

        <!-- 背景 -->

        <img
            class="bg"
            src="first.image/Frame 1.png"
        >

        <!-- 导航 -->

        <div
            class="nav-wrap"
            id="navWrap"
        >

            <img
                class="nav-bg"
                id="navBg"
                src="first.image/Rectangle 1.png"
            >

            <a
                href="index.html"
                class="nav nav-home"
            >
                首页
            </a>

            <a
                href="about.html"
                class="nav nav-about"
            >
                关于
            </a>

            <a
                href="intro.html"
                class="nav nav-intro"
            >
                简介
            </a>

        </div>

        <!-- 人物 -->

        <img
            class="person"
            id="person"
            src="first.image/不到人 1.png"
        >

        <!-- 蓝字整体 -->

        <div
            class="bottom-wrap"
            id="bottomWrap"
        >

            <!-- 蓝字 -->

            <img
                class="bottom-title"
                src="first.image/Geese and chameleon.png"
            >

            <!-- 横线 -->

            <div class="bottom-line"></div>

        </div>

    </div>

</div>

<!-- 第二部分 -->

<div class="fake-section"></div>

<script>

/* =========================
   入场动画
========================= */

gsap.from(".bg",{

    scale:1.03,

    opacity:0,

    duration:1.4,

    ease:"power3.out"
});

gsap.from(".person",{

    y:120,

    rotate:8,

    opacity:0,

    duration:1.5,

    ease:"elastic.out(1,0.55)"
});

gsap.from(".nav-wrap",{

    y:-70,

    opacity:0,

    duration:1
});

gsap.from(".bottom-wrap",{

    y:100,

    opacity:0,

    duration:1.3,

    ease:"power3.out"
});


/* =========================
   点击摇摆
========================= */

const person =
document.getElementById("person");

person.addEventListener("click",()=>{

    gsap.killTweensOf(person);

    gsap.timeline()

    .to(person,{
        rotation:10,
        duration:0.18
    })

    .to(person,{
        rotation:-8,
        duration:0.22
    })

    .to(person,{
        rotation:5,
        duration:0.18
    })

    .to(person,{
        rotation:-3,
        duration:0.16
    })

    .to(person,{
        rotation:0,
        duration:0.8,
        ease:"elastic.out(1,0.35)"
    });

});


/* =========================
   滚动视差
========================= */

window.addEventListener("scroll",()=>{

    const scrollY =
    window.scrollY;


 let navTop =
310 - scrollY * 1.2;

if(navTop <= 30){

    navTop = 30;
}

let navScale =
1 - scrollY * 0.00045;

if(navScale <= 0.72){

    navScale = 0.72;
}

gsap.to("#navWrap",{

    top:navTop,

    scale:navScale,

    duration:0.7,

    ease:"power2.out"
});
    /* =====================
       导航透明
    ===================== */

    let navOpacity =
    1 - (scrollY / 1000);

    navOpacity =
    Math.max(0.4,navOpacity);

    gsap.to("#navBg",{

        opacity:navOpacity,

        duration:0.5
    });


    /* =====================
       人物
    ===================== */

    let personMove =
    scrollY * 0.32;

    if(personMove >= 250){

        personMove = 250;
    }

    gsap.to("#person",{

        y:-personMove,

        scale:
        1 - (scrollY * 0.00018),

        duration:0.9,

        ease:"power2.out"
    });


    /* =====================
       蓝字 + 横线
    ===================== */

    let bottomMove =
    scrollY * 0.16;

    if(bottomMove >= 180){

        bottomMove = 180;
    }

    gsap.to("#bottomWrap",{

        y:-bottomMove,

        duration:1,

        ease:"power2.out"
    });


    /* =====================
       底部遮挡
    ===================== */

    let maskHeight =
    200 + scrollY * 0.45;

    maskHeight = Math.min(

        maskHeight,

        window.innerHeight
    );

    gsap.to("#bottomMask",{

        height:maskHeight,

        duration:0.5
    });

});

</script>

</body>

</html>
